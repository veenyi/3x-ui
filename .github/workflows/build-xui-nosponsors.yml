name: Build x-ui (no sponsors)

on:
  push:
    tags:
      - "v*-nosponsor"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        default: main
        required: false

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Fails loudly if the sponsor opt-out was lost in a merge/rebase, instead of
      # quietly shipping a build that still shows the login-page ad.
      - name: Verify sponsor opt-out patch is present
        run: |
          grep -q 'XUI_DISABLE_SPONSORS' internal/web/service/panel/sponsor.go || {
            echo "::error=patch 0001-sponsors-env-optout is missing from this ref"
            exit 1
          }
          echo "sponsor opt-out present"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # //go:embed all:dist in internal/web/web.go needs internal/web/dist to exist
      # before the Go build, and dist is gitignored.
      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Build 3X-UI
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/x86-64/tarballs/"
          TARBALL_URL=$(curl -fsSL --retry 5 --retry-all-errors "$TARBALL_BASE" \
            | grep -oE "x86-64--musl--stable-[^\"]+\.tar\.xz" | sort -r | head -n1)
          [ -z "$TARBALL_URL" ] && { echo "no toolchain found" >&2; exit 1; }
          cd /tmp
          curl -fL -sS --retry 5 -o tc.tar.xz "$TARBALL_BASE/$TARBALL_URL"
          tar -xf tc.tar.xz
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "x86-64--musl--stable-*" | head -n1)
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          cd "$GITHUB_WORKSPACE"
          go build -buildvcs=false -ldflags "-w -s -linkmode external -extldflags '-static'" -o x-ui .
          file x-ui
          ldd x-ui || echo "static binary confirmed"

      - uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-amd64-nosponsor
          path: x-ui
