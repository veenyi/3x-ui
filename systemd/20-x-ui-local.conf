# Local additions only. 10-xui-sandbox.conf is regenerated by install.sh/update.sh
# on every update, so anything written there is lost; this file is not touched.
[Service]
# Read by the patched cachedSponsors() in internal/web/service/panel/sponsor.go.
# Unset or any value other than "true" restores upstream behaviour.
Environment=XUI_DISABLE_SPONSORS=true
